services:
  postgres:
    image: postgres:16-alpine
    container_name: reuse-web-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reuse
      POSTGRES_PASSWORD: reuse
      POSTGRES_DB: reuse_web
    ports:
      - "5432:5432"
    volumes:
      - reuse_postgres_data:/var/lib/postgresql/data

volumes:
  reuse_postgres_data:
